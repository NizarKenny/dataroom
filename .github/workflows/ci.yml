name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # prisma generate reads the datasource block, so the variables have to
      # exist. Nothing here connects to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install rather than npm ci: the lockfile is written on Windows and
      # npm records only the platform it resolved on for rolldown's native
      # binding, which vitest needs. See npm/cli#4828.
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - run: npm run typecheck --workspaces --if-present
      - run: npm run test --workspaces --if-present
      - run: npm run build --workspace @dataroom/web
